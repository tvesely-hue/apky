let mode='photo', orient='h', col='#cfd4dc';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x0b1220);
const camera=new THREE.PerspectiveCamera(50,1,1,3000);
const renderer=new THREE.WebGLRenderer({antialias:true});
document.getElementById('scene').appendChild(renderer.domElement);
const ctrl={ry:0.8,rx:0.32,dist:520,cx:86.5,cy:122,cz:82};
function resize(){const el=document.getElementById('scene');camera.aspect=el.clientWidth/el.clientHeight;camera.updateProjectionMatrix();renderer.setSize(el.clientWidth,el.clientHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));}
addEventListener('resize',resize);
function photoTex(b64){const t=new THREE.TextureLoader().load(b64);t.colorSpace=THREE.SRGBColorSpace;return t;}
function tileTex(){const c=document.createElement('canvas');c.width=240;c.height=240;const x=c.getContext('2d');
x.fillStyle=col;x.fillRect(0,0,240,240);
const g=x.createLinearGradient(0,0,240,240);g.addColorStop(0,'rgba(255,255,255,.16)');g.addColorStop(.5,'rgba(255,255,255,.05)');g.addColorStop(1,'rgba(0,0,0,.12)');x.fillStyle=g;x.fillRect(0,0,240,240);
for(let i=0;i<9;i++){x.strokeStyle='rgba(255,255,255,'+(0.04+Math.random()*0.05)+')';x.lineWidth=6+Math.random()*20;x.beginPath();const px=Math.random()*240,py=Math.random()*240;x.moveTo(px,py);x.bezierCurveTo(px+60*(Math.random()-.5),py+60*(Math.random()-.5),px+120*(Math.random()-.5),py+120*(Math.random()-.5),px+200*(Math.random()-.5),py+200*(Math.random()-.5));x.stroke();}
x.strokeStyle='rgba(10,14,22,.55)';x.lineWidth=2;x.strokeRect(0,0,240,240);x.strokeRect(1,1,238,238);
const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t;}
function build(){
while(scene.children.length)scene.remove(scene.children[0]);
scene.add(new THREE.AmbientLight(0xffffff,0.9));
const dl=new THREE.DirectionalLight(0xffffff,0.55);dl.position.set(150,300,250);scene.add(dl);
// room: x = 0..173 (zadní stěna na z=0? Actually zadní stěna is far wall)
// layout: zádí (173) at z=0; levá (164) at x=0; dveřní (prava+vchod opposite side) at z=164? Keep simple: L-shape
const WA=173, WB=164, WH=245;
const groups=[];
function wall(w,h,tex,px,py,pz,ry){
const g=new THREE.Group();
const geo=new THREE.PlaneGeometry(w,h);
let mat;
if(mode==='photo'||(mode==='mix'&&tex)){mat=new THREE.MeshStandardMaterial({map:tex,roughness:.85});}
else{mat=new THREE.MeshStandardMaterial({map:tileTex(),roughness:.5});}
const m=new THREE.Mesh(geo,mat);g.add(m);
if(mode==='tile'||mode==='mix'){
// grout lines overlay via grid lines
const lm=new THREE.LineBasicMaterial({color:0x0b1220,transparent:true,opacity:.5});
const tw=orient==='h'?120:60, th=orient==='h'?60:120;
const pts=[];
for(let i=tw;i<w;i+=tw){pts.push(new THREE.Vector3(i-w/2,-h/2,1),new THREE.Vector3(i-w/2,h/2,1));}
for(let j=th;j<h;j+=th){pts.push(new THREE.Vector3(-w/2,j-h/2,1),new THREE.Vector3(w/2,j-h/2,1));}
const lg=new THREE.BufferGeometry().setFromPoints(pts);g.add(new THREE.LineSegments(lg,lm));}
g.position.set(px,py,pz);g.rotation.y=ry;scene.add(g);groups.push(g);return g;}
// zadní stěna (173 x 245) at z=0 facing +z
wall(WA,WH,PHOTOS.zadni?photoTex(PHOTOS.zadni):null,WA/2,WH/2,0,0);
// levá stěna (164 x 245) at x=0 facing +x
wall(WB,WH,PHOTOS.leva?photoTex(PHOTOS.leva):null,0,WH/2,WB/2,Math.PI/2);
// pravá stěna (dveřní část) at x=WA facing -x
wall(WB,WH,PHOTOS.prava?photoTex(PHOTOS.prava):null,WA,WH/2,WB/2,-Math.PI/2);
// stěna s východem (zadní pravá? opposite to zadní) at z=WB facing -z? Use as 4th wall
wall(WA,WH,PHOTOS.vchod?photoTex(PHOTOS.vchod):null,WA/2,WH/2,WB,Math.PI);
// podlaha
const fl=new THREE.Mesh(new THREE.PlaneGeometry(WA,WB),new THREE.MeshStandardMaterial({color:0x3a332a,roughness:.9}));
fl.rotation.x=-Math.PI/2;fl.position.set(WA/2,0,WB/2);scene.add(fl);
// strop
const st=new THREE.Mesh(new THREE.PlaneGeometry(WA,WB),new THREE.MeshStandardMaterial({color:0xe8e6e2,roughness:.95}));
st.rotation.x=Math.PI/2;st.position.set(WA/2,WH,WB/2);scene.add(st);
}
function render(){
camera.position.set(ctrl.cx+ctrl.dist*Math.cos(ctrl.rx)*Math.sin(ctrl.ry),ctrl.cy+ctrl.dist*Math.sin(ctrl.rx),ctrl.cz+ctrl.dist*Math.cos(ctrl.rx)*Math.cos(ctrl.ry));
camera.lookAt(ctrl.cx,ctrl.cy,0);
renderer.render(scene,camera);requestAnimationFrame(render);}
function update(){build();resize();}
document.getElementById('mode').onclick=e=>{if(e.target.dataset.v){mode=e.target.dataset.v;[...e.currentTarget.children].forEach(b=>b.classList.toggle('on',b===e.target));update();}};
document.getElementById('orient').onclick=e=>{if(e.target.dataset.v){orient=e.target.dataset.v;[...e.currentTarget.children].forEach(b=>b.classList.toggle('on',b===e.target));update();}};
document.getElementById('col').onclick=e=>{if(e.target.dataset.v){col=e.target.dataset.v;[...e.currentTarget.children].forEach(b=>b.classList.toggle('on',b===e.target));update();}};
document.getElementById('reload').onclick=update;
// touch controls
let tc={};
document.getElementById('scene').addEventListener('touchstart',e=>{if(e.touches.length===1){tc={x:e.touches[0].clientX,y:e.touches[0].clientY,ry:ctrl.ry,rx:ctrl.rx};}else{tc={d:Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY),dist:ctrl.dist};}},{passive:true});
document.getElementById('scene').addEventListener('touchmove',e=>{e.preventDefault();if(e.touches.length===1){ctrl.ry=tc.ry+(e.touches[0].clientX-tc.x)*0.006;ctrl.rx=Math.max(-0.2,Math.min(1.2,tc.rx+(e.touches[0].clientY-tc.y)*0.006));}else{const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);ctrl.dist=Math.max(150,Math.min(1400,tc.dist*tc.d/d));}},{passive:false});
let me={};
renderer.domElement.addEventListener('mousedown',e=>{me={x:e.clientX,y:e.clientY,ry:ctrl.ry,rx:ctrl.rx};});
addEventListener('mousemove',e=>{if(me.x!==undefined){ctrl.ry=me.ry+(e.clientX-me.x)*0.005;ctrl.rx=Math.max(-0.2,Math.min(1.2,me.rx+(e.clientY-me.y)*0.005));}});
addEventListener('mouseup',()=>{me={};});
renderer.domElement.addEventListener('wheel',e=>{e.preventDefault();ctrl.dist=Math.max(150,Math.min(1400,ctrl.dist*(1+e.deltaY*0.001)));},{passive:false});
const info=document.getElementById('info');
function calc(){
const tw=orient==='h'?120:60,th=orient==='h'?60:120;
const areaA=Math.ceil(173/tw)*Math.ceil(245/th);
const areaB=Math.ceil(164/tw)*Math.ceil(245/th);
const total=(areaA+areaB)*2; // zadní+levá+dvojnásobek? rough
info.textContent=`Zadní stěna: ${Math.ceil(173/tw)}×${Math.ceil(245/th)} = ${areaA} ks\nLevá stěna: ${Math.ceil(164/tw)}×${Math.ceil(245/th)} = ${areaB} ks\nCelkem (bez výřezů) ≈ ${total} ks dlažby 60×120 + 10 % rezerva`;}
calc();update();render();
</script></body></html>
