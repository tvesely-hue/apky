<script>
let listening = false, rec = null;
/* JEN MLUVENÍ — čistá hlasová appka (bez textového pole) */
let key = localStorage.getItem('gkey') || '';
const statusEl = document.getElementById('status');

/* iOS: hlasy se načítají asynchronně — načteme je hned při startu */
if (typeof speechSynthesis !== 'undefined') {
  speechSynthesis.getVoices();
  speechSynthesis.onvoiceschanged = () => { speechSynthesis.getVoices(); };
}
const chatEl = document.getElementById('chat');
const micBtn = document.getElementById('micBtn');

if (key) document.getElementById('key').value = '••••••';
// automatické předvyplnění klíče z URL (?key=...)
try {
  const u = new URL(location.href);
  const k = u.searchParams.get('key');
  if (k) { localStorage.setItem('gkey', k); key = k; history.replaceState(null,'',location.pathname); }
} catch(e){}
if (key) document.getElementById('key').value = '••••••';
function saveKey(){ key = document.getElementById('key').value.trim(); localStorage.setItem('gkey', key); addMsg('me','Klíč uložen ✅'); document.getElementById('set').classList.remove('show'); }

function addMsg(cls, text){
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.textContent = text;
  // POZOR: žádné tlačítko "🔊 Přečíst" pod zprávou — odpověď se čte SAMA hned po doručení.
  // Tlačítko jinak mate (klepneš na něj místo "Ptát se dál" a odpověď se přečte ZNOVU).
  chatEl.appendChild(d);
  chatEl.scrollTop = chatEl.scrollHeight;
}
function setStatus(t){ statusEl.textContent = t; }

/* ====== REŽIM: 🤖 GLM (rychlé, v appce) / 🧠 Hermes (přes most — má paměť a nástroje, ~1-2 min) ====== */
let hermesMode = localStorage.getItem('hmode') === 'hermes';
let bridgeUrl = localStorage.getItem('hbridge') || '';
async function toggleMode(){
  hermesMode = !hermesMode;
  localStorage.setItem('hmode', hermesMode ? 'hermes' : 'glm');
  updateModeBtn();
  if (hermesMode) {
    setStatus('🧠 Režim Hermes…');
    try {
      const r = await fetch('https://tvesely-hue.github.io/apky/bridge-url.txt', { cache: 'no-store' });
      const u = (await r.text()).trim();
      if (u) { bridgeUrl = u; localStorage.setItem('hbridge', u); }
    } catch(e){}
    if (!bridgeUrl) setStatus('🧠 Most nedostupný — zůstává GLM');
    else setStatus(hermesMode ? '🧠 Hermes — mluv' : '🤖 GLM — mluv');
  } else {
    setStatus('🤖 GLM — mluv');
  }
}
function updateModeBtn(){
  const b = document.getElementById('modeBtn');
  if (b) { b.textContent = hermesMode ? '🧠 Hermes' : '🤖 GLM'; b.style.background = hermesMode ? '#276749' : '#0e1117'; }
}
updateModeBtn();
/* Hermes režim: pošle otázku na most, počká na odpověď (až 3 min), přečte ji */
/* LONG verze: čeká až 6 min (72 × 5 s) — v Hermes režimu GLM NEODPOVÍDÁ, Tomáš počká */
async function askBridgeLong(text){
  /* TUNEL SE ROTUJE: před každým POSTEM si čerstvě vezmu aktuální adresu z GitHubu —
     jinak otázka jde na starou (mrtvou) adresu a "nedostal jsem odpověď v čase". */
  try {
    const r2 = await fetch('https://tvesely-hue.github.io/apky/bridge-url.txt', { cache: 'no-store' });
    const u2 = (await r2.text()).trim();
    if (u2) { bridgeUrl = u2; localStorage.setItem('hbridge', u2); bridgeBase = u2; localStorage.setItem('bridgeUrl', u2); }
  } catch(_){}
  if (!bridgeUrl) return null;
  const POST = bridgeUrl + '/bridge/ask';
  const GET = bridgeUrl + '/bridge/answer?id=';
  try {
    const r = await fetch(POST, {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ text: text })
    });
    if (!r.ok) throw new Error('ask ' + r.status);
    const j = await r.json();
    const qid = j.id;
    if (!qid) throw new Error('no id');
    for (let i = 0; i < 72; i++) {   // 72 × 5 s = 6 min
      await new Promise(res => setTimeout(res, 5000));
      try {
        const a = await fetch(GET + qid, { cache: 'no-store' });
        const aj = await a.json();
        if (aj.status === 'done' && aj.text) return aj.text;
      } catch(_){
        /* tunel se mezitím zrotoval → čerstvá adresa a pokračovat */
        try {
          const r3 = await fetch('https://tvesely-hue.github.io/apky/bridge-url.txt', { cache: 'no-store' });
          const u3 = (await r3.text()).trim();
          if (u3) { bridgeUrl = u3; localStorage.setItem('hbridge', u3); bridgeBase = u3; localStorage.setItem('bridgeUrl', u3); }
        } catch(_){}
      }
      setStatus('🧠 Hermes přemýšlí… (' + (i*5+5) + ' s)');
    }
    return null;   // po 6 min — appka srozumitelně řekne, GLM se nezapne
  } catch(e) {
    setStatus('🧠 Most nedostupný');
    return null;
  }
}

async function askBridge(text){
  if (!bridgeUrl) return null;
  const POST = bridgeUrl + '/bridge/ask';
  const GET = bridgeUrl + '/bridge/answer?id=';
  try {
    const r = await fetch(POST, {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ text: text })
    });
    if (!r.ok) throw new Error('ask ' + r.status);
    const j = await r.json();
    const qid = j.id;
    if (!qid) throw new Error('no id');
    for (let i = 0; i < 36; i++) {   // 36 × 5 s = 3 min
      await new Promise(res => setTimeout(res, 5000));
      const a = await fetch(GET + qid, { cache: 'no-store' });
      const aj = await a.json();
      if (aj.status === 'done' && aj.text) return aj.text;
      setStatus('🧠 Hermes přemýšlí… (' + (i*5+5) + ' s)');
    }
    return null;   // timeout — GLM fallback
  } catch(e) {
    setStatus('🧠 Most nedostupný — GLM záloha');
    return null;
  }
}

/* ====== HLAS: verze 44 — NATIVNÍ hlas iOS (speechSynthesis) jako hlavní, Google TTS jako záloha ======
   Proč: řetězení Google TTS kusů je na iOS křehké (odpověď se nepřečte celá).
   Nativní hlas přečte celou odpověď najednou. Známé iOS bugy, které opravujeme:
   1) utterance v lokální proměnné → garbage collector ji zabije → přečte jen pár slov → DRŽÍME ji v globální proměnné
   2) na iOS se řeč po ~15 s zasekne → pravidelný pause()+resume() to udrží v chodu
   3) hlas se vybírá asynchronně → hledáme český hlas s opakováním */

function ttsUrl(text){
  return 'https://translate.google.com/translate_tts?ie=UTF-8&tl=cs&client=tw-ob&q=' + encodeURIComponent(text.slice(0,190));
}
/* BRIDGE proxy: server nemá problém s Refererem a přidá CORS → fetch() funguje.
   WebAudio (AudioContext) na rozdíl od přehrávače NEPŘERUŠÍ audio session → mikrofon nezabije. */
let bridgeBase = localStorage.getItem('bridgeUrl') || '';
function refreshBridgeUrl(){
  fetch('https://tvesely-hue.github.io/apky/bridge-url.txt', {cache: 'no-store'})
    .then(r => r.ok ? r.text() : '')
    .then(u => { u = (u || '').trim(); if (u) { bridgeBase = u; localStorage.setItem('bridgeUrl', u); } })
    .catch(() => {});
}
refreshBridgeUrl();
setInterval(refreshBridgeUrl, 60000);   // tunel se rotuje — kontrolovat každou minutu
function ttsProxyUrl(text){
  return bridgeBase + '/bridge/tts?q=' + encodeURIComponent(text.slice(0,190));
}
/* WebAudio: dekódované audio kusy */
let actx = null;
function audioCtx(){
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){} }
  if (actx && actx.state === 'suspended') { try { actx.resume(); } catch(e){} }
  return actx;
}

let activePlayers = [];   // záložní přehrávače (Google TTS)
let speakId = 0;          // číslo generace — nová odpověď zruší starý queue
let currentUtter = null;  // DRŽENÉ reference — jinak GC přečte jen pár slov (známý bug)
let speakTimer = null;    // pravidelný resume — ať se na iOS řeč nezasekne po 15 s

function playPartsGoogle(parts, i, myId, tries){   // WebAudio přes proxy mostu (mikrofon žije)
  if (i >= parts.length) { restartListening(); return; }
  tries = tries || 0;
  /* iOS: po dlouhém čekání (přemýšlení) Safari audio zamkne — resume() SAM O NICH vrací
     provoz. Kdyby context zůstal suspended i po resume (ne-gesto), POZNA se ve statusu. */
  const ctx = audioCtx();
  if (!ctx) { setStatus('🔊 Nepovedlo se přehrát (audio)'); restartListening(); return; }
  if (ctx.state === 'suspended') {
    setStatus('🔇 Klepni kamkoli na obrazovku — Safari zamkl zvuk');
    const wake = () => { audioCtx(); document.removeEventListener('click', wake); };
    document.addEventListener('click', wake);
  }
  setStatus('🔊 Čtu…');
  fetch(ttsProxyUrl(parts[i]), {cache: 'no-store'})
    .then(r => { if (!r.ok) throw new Error('http ' + r.status); return r.arrayBuffer(); })
    .then(buf => ctx.decodeAudioData(buf))
    .then(audio => {
      if (myId !== speakId) return;
      const src = ctx.createBufferSource();
      src.buffer = audio;
      src.connect(ctx.destination);
      activePlayers.push(src);
      // WebAudio: onended JE SPOLEHLIVÉ — a fallback timer jen pojistka
      const dur = audio.duration || 5;
      let done = false;
      const finish = () => {
        if (done) return; done = true;
        if (myId !== speakId) return;
        try { src.stop(); } catch(e){}
        playPartsGoogle(parts, i + 1, myId);
      };
      src.onended = finish;
      setTimeout(finish, dur * 1000 + 2500);
      src.start();
    })
    .catch(e => {
      if (myId !== speakId) return;
      if (tries < 3) { setStatus('🔊 Opakuju kus…'); setTimeout(() => { if (myId === speakId) playPartsGoogle(parts, i, myId, tries + 1); }, 800); return; }
      setStatus('🔊 Nepovedlo se přehrát: ' + (e.message || ''));
      restartListening();
    });
}
function findCzechVoice(){
  const vs = speechSynthesis.getVoices();
  return vs.find(v => v.lang === 'cs-CZ') || vs.find(v => v.lang && v.lang.indexOf('cs') === 0) || null;
}

function speakNow(text){
  // Zastavím vše — nová odpověď zastaví předchozí
  activePlayers.forEach(a => { try { a.pause ? a.pause() : a.stop(); } catch(_){} });
  activePlayers = [];
  if (speakTimer) { clearInterval(speakTimer); speakTimer = null; }
  try { speechSynthesis.cancel(); } catch(_){}
  speakId++;
  const myId = speakId;
  speaking = true;   // blokace restartu mikrofonu během mluvení
  recActive = false;  // stará instance končí — nechcem, aby blokovala startRec po odpovědi
  try { rec && rec.stop(); } catch(_){}
  setStatus('🔴 Odpovídám…');
  // 350 ms po rec.stop() — iOS potřebuje uvolnit audio session od mikrofonu
  // POZOR: iOS Safari po mikrofonu ZABIJE nativní hlas (speechSynthesis) — proto odpověď čteme
  // POUZE Google TTS (nový Audio per kus — mechanismus v8, ověřený). Nativní hlas jen na test zvuku.
  setTimeout(() => { if (myId === speakId) playPartsGoogle(splitParts(text), 0, myId); }, 350);
}

function speakNative(text, myId){
  if (myId !== speakId) return;
  if (typeof speechSynthesis === 'undefined') { playPartsGoogle(splitParts(text), 0, myId); return; }
  const voice = findCzechVoice();
  const parts = splitParts(text);
  let idx = 0;
  let watchdog = null;
  const done = () => {
    if (watchdog) { clearTimeout(watchdog); watchdog = null; }
    if (myId !== speakId) return;
    restartListening();
  };
  const speakNext = () => {
    if (myId !== speakId) return;
    if (idx >= parts.length) { done(); return; }
    const u = new SpeechSynthesisUtterance(parts[idx]);
    u.lang = 'cs-CZ';
    if (voice) u.voice = voice;
    u.rate = 1.0;
    u.volume = 1.0;
    currentUtter = u;   // KRITICKÉ: držím referenci — jinak GC přečte jen pár slov
    const i = idx;
    let moved = false;
    let started = false;
    const advance = () => {
      if (moved) return; moved = true;
      if (watchdog) { clearTimeout(watchdog); watchdog = null; }
      if (myId !== speakId) return;
      if (i === parts.length - 1) { done(); return; }
      idx++;
      setTimeout(speakNext, 60);
    };
    u.onend = advance;
    u.onerror = advance;
    const fallbackToGoogle = () => {
      if (moved) return; moved = true;
      if (watchdog) { clearTimeout(watchdog); watchdog = null; }
      if (myId !== speakId) return;
      try { speechSynthesis.cancel(); } catch(_){}
      playPartsGoogle(splitParts(text), 0, myId);
    };
    u.onstart = () => { started = true; };
    // iOS: onend se někdy NIKDY nezavolá → záložní odhad délky (mźdzs/znak + rezerva)
    const est = 90 * parts[i].length + 3500;
    watchdog = setTimeout(advance, est);
    // iOS: native hlas se někdy VŮBEC nerozjede (žádné onstart, žádná chyba) → Google TTS
    setTimeout(() => { if (!started && !moved) fallbackToGoogle(); }, 3000);
    try { speechSynthesis.speak(u); } catch(e){
      // nativní hlas úplně nefunkční → záloha Google TTS (fungovala verze 8)
      if (speakTimer) { clearInterval(speakTimer); speakTimer = null; }
      playPartsGoogle(splitParts(text), 0, myId);
      return;
    }
  };
  speakNext();
}

function splitParts(text){
  const sents = text.match(/[^.!?]+[.!?]+(\s|$)|[^.!?]+$/g) || [text];
  const parts = [];
  let cur = '';
  for (const s of sents){
    if ((cur + s).length > 185) { if (cur) parts.push(cur); cur = s; }
    else cur += s;
  }
  if (cur) parts.push(cur);
  return parts.length ? parts : [text];
}

function testSound(){
  // Zastavím vše — a pak přehraju test nativním hlasem
  activePlayers.forEach(a => { try { a.pause ? a.pause() : a.stop(); } catch(_){} });
  activePlayers = [];
  try { speechSynthesis.cancel(); } catch(_){}
  const u = new SpeechSynthesisUtterance('Test zvuku. Slyšíš mě po celou větu? Ať víme, že hlas funguje.');
  u.lang = 'cs-CZ';
  const v = findCzechVoice();
  if (v) u.voice = v;
  currentUtter = u;
  u.onend = () => setStatus('Zvuk hraje ✅ — nativní hlas funguje');
  u.onerror = () => {
    // nativní hlas nehrá → zkusím Google TTS
    const p = new Audio(ttsUrl('Test zvuku. Slyšíš mě po celou větu?'));
    p.referrerPolicy = 'no-referrer';
    p.volume = 1;
    p.play().then(()=>{ setStatus('Zvuk hraje ✅ — záložní hlas'); }).catch(e=>{ setStatus('Nepovedlo se přehrát: ' + (e.message||'')); });
  };
  try { speechSynthesis.speak(u); } catch(e){ setStatus('Nepovedlo se přehrát'); }
}

/* po přehrání odpovědi se poslech sám obnoví — nemusíš vypínat/zapínat mikrofon */
/* === JEDNODUCHÝ FLOW (podle přání Tomáše): mluvíš → odpověď → KLEPNI NA TLAČÍTKO → mluvíš zase ===
   Žádné automatické zapínání poslechu — to na iOS opakovaně selhává. Po odpovědi se poslech
   zastaví a čeká na klepnutí. Klepnutí kamkoli = start poslechu (100 % spolehlivý gesto). */
/* STT OPRAVY: Safari rozpoznávání pokřiví slova — opravím známé výrazy před odesláním */
function fixTranscript(t){
  const fixes = [
    /* Safari slyší "Hormuzský průliv" jako "horský/horském průlivu" — opravím všechna skloňování */
    [/horsk\w*\s*pr(u|ů)liv\w*/gi, 'Hormuzském průlivu'],
    [/hormuzsk\w*\s*pruliv\w*/gi, 'Hormuzském průlivu'],
    [/hormuz|ormuz/gi, 'Hormuz'],
    [/hlasov(ý|y|im|ím)\s*(hermes)?/gi, 'hlasový Hermes'],
    [/st(ě|e)panov/gi, 'Štěpánov'],
    [/televizni program/gi, 'televizní program'],
  ];
  for (const [re, rep] of fixes) t = t.replace(re, rep);
  return t;
}

function restartListening(){
  speaking = false;
  recActive = false;
  try { rec && rec.stop(); } catch(_){}
  listening = false;
  micBtn.classList.remove('listening');
  micBtn.textContent = '🎤 Ptát se dál';
  micBtn.style.width = 'auto';
  micBtn.style.padding = '0 24px';
  micBtn.style.fontSize = '22px';
  setStatus('Přečteno ✅ — klepni na tlačítko a zeptej se znovu');
}

/* ====== ZPRÁVY / API ====== */
/* zjištění polohy (GPS) — pro počasí */
function getPos(){
  return new Promise((res) => {
    if (!navigator.geolocation) return res(null);
    navigator.geolocation.getCurrentPosition(
      (p) => res({ lat: p.coords.latitude, lon: p.coords.longitude }),
      () => res(null),
      { timeout: 8000 }
    );
  });
}

/* počasí z Open-Meteo (zdarma, bez klíče) */
async function weatherData(){
  const pos = await getPos();
  if (!pos) return null;
  const u = 'https://api.open-meteo.com/v1/forecast?latitude=' + pos.lat + '&longitude=' + pos.lon +
    '&current=temperature_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m&daily=temperature_2m_max,temperature_2m_min,precipitation_sum,weather_code&timezone=auto&forecast_days=7';
  const r = await fetch(u);
  const j = await r.json();
  return j;
}

/* slovní popis počasí z kódu (WMO) */
function weatherText(code){
  if (code === 0) return 'čisto';
  if (code === 1 || code === 2) return 'polojasno';
  if (code === 3) return 'zamračeno';
  if (code === 45 || code === 48) return 'mlhy';
  if (code >= 51 && code <= 57) return 'mrholení';
  if (code >= 61 && code <= 67) return 'déšť';
  if (code >= 71 && code <= 77) return 'sníh';
  if (code >= 80 && code <= 82) return 'přeháňky';
  if (code >= 85 && code <= 86) return 'sněhové přeháňky';
  if (code >= 95) return 'bouřky';
  return 'proměnlivě';
}

const days = ['neděle','pondělí','úterý','středa','čtvrtek','pátek','sobota'];

/* Doplněk — RSS zprávy/dopravní info přes r.jina.ai (zdarma, bez klíče, CORS povolený) */
async function fetchViaJina(url){
  const r = await fetch('https://r.jina.ai/' + url);
  const txt = await r.text();
  return txt;
}

/* dopravní info — RSS z auto.idnes.cz (zdarma, bez klíče) */
async function trafficData(){
  try {
    const txt = await fetchViaJina('https://auto.idnes.cz/rss');
    // Podívám se na články — hledám dopravní/silniční
    const lines = txt.split('\n').filter(l => l.startsWith('### ['));
    const out = [];
    for (const l of lines.slice(0, 10)) {
      const m = l.match(/\[([^\]]+)\]/);
      if (m) out.push(m[1]);
    }
    return out.length ? out.join(' ||| ') : null;
  } catch(e){ return null; }
}

/* zprávy — RSS z novinky.cz (zdarma, bez klíče) */
async function newsData(){
  try {
    const txt = await fetchViaJina('https://www.novinky.cz/rss');
    const lines = txt.split('\n').filter(l => l.startsWith('### ['));
    const out = [];
    for (const l of lines.slice(0, 10)) {
      const m = l.match(/\[([^\]]+)\]/);
      if (m) out.push(m[1]);
    }
    return out.length ? out.join(' ||| ') : null;
  } catch(e){ return null; }
}

/* paměť konverzace — appka si pamatuje, co jsme si řekli */
let history = [];
let lastAnswer = '';   // poslední odpověď — pro „přečti to znovu“ (okamžitě, bez mostu)

async function ask(text){
  if (!key) { addMsg('ai','Nejdřív vlož OpenRouter key (⚙️ vpravo nahoře).'); speakNow('Nejdřív vlož klíč OpenRouter. Nahoře je ozubené kolo.'); return; }
  addMsg('me', text);
  /* OPAKOVÁNÍ: „přečti to znovu / ještě jednou / zopakuj to“ → přečtu POSLEDNÍ odpověď
     okamžitě místně — neposílá se žádná nová otázka přes most (proto to dřív trvalo dlouho). */
  const rt = text.toLowerCase();
  if (lastAnswer && /přeč(te|ti|ti to)|znovu|ještě jednou|zopakuj|opakuj|znova|still to same|ještě raz|znovu to povez/.test(rt)
      && rt.length < 60 && !/program|počas|zprav|cena|kurz|jaky|jakou|kolik|kdy|proč|pro|kdo|co je|co je to|kontakt/.test(rt)) {
    addMsg('ai', lastAnswer);
    speakNow(lastAnswer);
    return;
  }
  // REŽIM HERMES: otázka jde ke mně přes most; selže-li → GLM záloha.
  // POČASÍ: doplním data I v Hermes režimu (jinak GLM/neubovysětí odpověď nezná počasí)!
  let btext = text;
  const t = text.toLowerCase();
  if (/počas|pocasi|jak.*venku|prš|déšť|dest|teplota|ochlad|venku/.test(t)) {
    try {
      const w = await weatherData();
      if (w) {
        btext = text + '\n\n[POČASÍ DATA (dnes max ' + Math.round(w.daily.temperature_2m_max[0]) +
          ' °C, min ' + Math.round(w.daily.temperature_2m_min[0]) + ' °C; zítra max ' +
          Math.round(w.daily.temperature_2m_max[1]) + ' °C, min ' + Math.round(w.daily.temperature_2m_min[1]) +
          ' °C; předpověď dní 3-7: ' +
          w.daily.temperature_2m_max.slice(2, 7).join(', ') + ' °C maxima, srážky ' +
          w.daily.precipitation_sum.slice(0, 7).map(p => Math.round(p * 100) + '%').join(', ') +
          ' ; dnes nyní ' + Math.round(w.current.temperature_2m) + ' °C, srážky ' + (w.current.precipitation||0) + ' mm)]';
      }
    } catch(e){}
  }
  if (hermesMode) {
    /* PŘANÍ TOMÁŠE: v Hermes režimu NEODPOVÍDÁ GLM NIKDY — čeká se na mě přes most.
       Důvod: GLM nemá internet a Tomáš si chce povídat se mnou. Čekání = až 6 min. */
    /* MIKROFON VYPNOUT: během mého přemýšlení i čtení odpovědi NIKDY neposlouchá —
       aby okolní mluva nešla do appky. Zase se zapne až po přečtení (klepnutím). */
    listening = false;
    try { rec && rec.stop(); } catch(_){}
    recActive = false;
    micBtn.classList.remove('listening');
    setStatus('🧠 Hermes přemýšlí…');
    const bt = await askBridgeLong(btext);
    if (bt) { lastAnswer = bt; addMsg('ai', bt); speakNow(bt); return; }
    /* most po 6 min neodpověděl → chybou nehodí, jen srozumitelně řekne */
    addMsg('ai', 'Nedostal jsem odpověď v čase. Zopakuj otázku, prosím.');
    speakNow('Nedostal jsem odpověď v čase. Zopakuj otázku, prosím.');
    return;
  }
  setStatus('🤔 Přemýšlím…');
  let extra = '';
  try {
    if (/počas|pocasi|jak.*venku|prš|déšť|dest|teplota|ochlad|venku/.test(t)) {
      const w = await weatherData();
      if (w) {
        extra = 'Aktuální počasí podle GPS uživatele: ' +
          'teplota ' + Math.round(w.current.temperature_2m) + ' °C, pocitově ' + Math.round(w.current.apparent_temperature) +
          ' °C, srážky ' + (w.current.precipitation||0) + ' mm, vítr ' + Math.round(w.current.wind_speed_10m) + ' km/h. ' +
          'Dnes max ' + Math.round(w.daily.temperature_2m_max[0]) + ' °C, min ' + Math.round(w.daily.temperature_2m_min[0]) +
          ' °C, srážky ' + (w.daily.precipitation_sum[0]||0) + ' mm. ';
        // ZÍTRA — pokud se ptá na zítra, doplním předpověď pro další den (i případně 3 dny)
        if (/zítra|zitra|dnes.*zítra|ok.*zítra|po.*dnes/.test(t)) {
          const d = new Date();
          const d1 = new Date(d.getTime() + 24*60*60*1000);
          extra += 'ZÍTRA (' + days[d1.getDay()] + '): ' + weatherText(w.daily.weather_code[1]) +
            ', max ' + Math.round(w.daily.temperature_2m_max[1]) + ' °C, min ' + Math.round(w.daily.temperature_2m_min[1]) +
            ' °C, srážky ' + (w.daily.precipitation_sum[1]||0) + ' mm. ';
        }
        if (/pozítří|pozitri|předpověd|predpoved|tyden|víkend|vikend/.test(t)) {
          for (let k = 1; k <= 3; k++) {
            const d2 = new Date(new Date().getTime() + k*24*60*60*1000);
            extra += days[d2.getDay()] + ': ' + weatherText(w.daily.weather_code[k]) +
              ', max ' + Math.round(w.daily.temperature_2m_max[k]) + ' °C, min ' + Math.round(w.daily.temperature_2m_min[k]) +
              ' °C, srážky ' + (w.daily.precipitation_sum[k]||0) + ' mm. ';
          }
        }
      }
    }
  } catch(e){}
  try {
    if (/doprav|silnic|nehod|kolon|uzavír|zavřen|cest|dálnic|d1|d2|d3|d4|d5|d6|d7|d10|d11|d35|r1|r2|r3|r4|r5|r6|r7|r8|r10|r11|r35|r43|r44|r48|r49|r52/.test(t)) {
      const traf = await trafficData();
      if (traf) extra = (extra ? extra + ' ' : '') + 'Aktuální dopravní informace (zdroj: dopravniinfo.cz): ' + traf + ' ';
    }
  } catch(e){}
  try {
    if (/zprávy|zprav|novinky|co se stalo|jaké je zprav|dnes zprav|aktuální|doporučen|zpravodaj|zpravodajství/.test(t)) {
      const news = await newsData();
      if (news) extra = (extra ? extra + ' ' : '') + 'Aktuální zprávy (zdroj: novinky.cz): ' + news + ' ';
    }
  } catch(e){}
  try {
    const r = await fetch('https://openrouter.ai/api/v1/chat/completions', {
      method: 'POST',
      headers: {'Content-Type':'application/json','Authorization':'Bearer ' + key},
      body: JSON.stringify({
        model: 'z-ai/glm-5.3-flash',
        messages: [
          { role:'system', content:'Jsi přátelský hlasový asistent jménem Hermes. Odpovídej česky, stručně (max 3–4 krátké věty), přirozeně — odpověď se bude číst nahlas při řízení auta. Nepoužívej markdown ani seznamy.' },
          { role:'system', content: extra },
          ...history,
          { role:'user', content: text }
        ]
      })
    });
    const j = await r.json();
    if (j.error && j.error.code === 401) { addMsg('ai','Klíč chybí nebo je neplatný. Otevři odkaz, který ti poslal Hermes (s klíčem), nebo vlož klíč v ⚙️.'); return; }
    const out = (j.choices?.[0]?.message?.content || '').replace(/\*\*/g,'').replace(/[*_#>\-]{1,2}/g,'');
    if (!out) throw new Error(JSON.stringify(j).slice(0,120));
    history.push({ role:'user', content: text });
    history.push({ role:'assistant', content: out });
    if (history.length > 12) history = history.slice(-12);
    lastAnswer = out;
    addMsg('ai', out);
    speakNow(out);
  } catch(e){
    addMsg('ai','Chyba: ' + e.message);
    speakNow('Něco se nepovedlo, zkus to znovu.');
  }
}

/* ====== MIKROFON ====== */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

/* nová instance rozpoznávání — Safari na iPhonu po stop() stejnou instanci znovu nespustí,
   takže vždy vytvoříme úplně novou */
let speaking = false;   // hraje odpověď — mikrofon se nikdy nespustí (jinak iOS přeruší zvuk a appka "vypadává")

let recActive = false;   // instance SKUTEČNĚ naběhla (onstart) — jinak onend smyčka spouští startRec dokola

let recRetries = 0;

/* NESLYŠITELNÝ zvuk (klíčový trik): iOS Safari po přehrání odpovědi drží audio session
   a rozpoznávání řeči pak "aborted". Přehrání tiché vlny ZNOVU OTEVŘE audio session
   v gestu uživatele a potom SR naběhne. */
let silentAudio = null;
function playSilentThenStart(){
  return new Promise((res) => {
    try {
      if (!silentAudio) {
        silentAudio = new Audio('data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=');
        silentAudio.volume = 0;
      }
      silentAudio.currentTime = 0;
      const p = silentAudio.play();
      if (p) p.then(() => { silentAudio.pause(); res(true); }).catch(() => res(false));
      else res(true);
    } catch(e){ res(false); }
  });
}

/* iOS: rozpoznávání po přehrání zvuku druhý den nežije — pomůže ZNOVU VZÍT PRÁVA K MIKROFONU
   (getUserMedia "probudí" audio session). Vrácený stream hned zavřu, ať ikonka neskáče. */
function micWarmup(){
  return new Promise((res) => {
    try {
      navigator.mediaDevices.getUserMedia({ audio: true })
        .then(s => { s.getTracks().forEach(t => t.stop()); res(true); })
        .catch(() => res(false));
    } catch(e){ res(false); }
  });
}

function startRec(){
  if (speaking) return;   // BĚHEM MLUVENÍ NIKDY NESPUSTÍMIKROFON — iOS přeruší zvuk
  if (recActive) return;  // instance už běží — nezačínat znovu (jinak smyčka startRec)
  rec = new SR();
  rec.lang = 'cs-CZ';
  rec.continuous = true;
  rec.interimResults = false;
  rec.onstart = () => { recActive = true; setStatus('Mluv…'); recWatchdog = 0; };
  /* iOS: reset watchdogu i při každém zvuku — ať dlouhá souvislá věta neumře po 15 s */
  rec.onsoundstart = () => { recWatchdog = 0; };
  rec.onspeechstart = () => { recWatchdog = 0; };
  rec.onspeechend = () => { recWatchdog = 0; };
  rec.onresult = (e) => {
    recWatchdog = 0;
    let t = e.results[e.results.length-1][0].transcript.trim();
    t = fixTranscript(t);
    if (t) ask(t);
  };
  rec.onerror = (e) => {
    recWatchdog = 0;
    if (e.error==='not-allowed') addMsg('ai','Musíš povolit mikrofon (Nastavení Safari → Mikrofon).');
    else if (e.error && e.error !== 'aborted' && e.error !== 'no-speech') setStatus('Mic: ' + e.error);
  };
  /* iOS: stejnou instanci po stop() znovu nespustí — VŽDY NOVÁ instance.
     Ale restart jen když instance SKUTEČNĚ naběhla (onstart) — jinak smyčka startRec dokola */
  /* POROZUMĚNÍ po víc otázkách: Safari rozpoznávání časem zpomalí/zanikne — GLOBÁLNÍ hlídač:
     každých 5 s zkontroluje, jestli poslech žije; když ne, nabídne KLEPNI PRO POKRAČOVÁNÍ */
  rec.onend = () => {
    const hadStarted = recActive;
    recActive = false;
    if (hadStarted && listening && !speaking) { setTimeout(() => { if (listening && !speaking) startRec(); }, 700); }
  };
  try { rec.start(); } catch(_){
    setTimeout(() => { if (listening && !speaking) startRec(); }, 1500);
  }
}

/* WATCHDOG: když Safari poslech tiše zabije (žádný onend, žádný výsledek), po 15 s ticha ho restartujeme */
let recWatchdog = 0;
setInterval(() => {
  if (listening && !speaking) {
    recWatchdog++;
    if (recWatchdog >= 15) {
      recWatchdog = 0;
      recActive = false;   // iOS tiše zabyl poslech bez onend — jinak startRec navždy blokován
      try { rec && rec.stop(); } catch(_){}
      setTimeout(() => { if (listening && !speaking) startRec(); }, 500);
    }
  } else {
    recWatchdog = 0;
  }
}, 1000);

function toggleMic(){
  if (!SR) { addMsg('ai','Tvůj prohlížeč nepodporuje rozpoznávání řeči. Otevř v Safari (iPhone) nebo Chrome.'); return; }
  // Klepnutí na tlačítko = VŽDY ZAPNI poslech (jednoduchý flow). Vypnout nemusíš —
  // poslech se zastaví sám po položení otázky (a znovu zapne klepnutím).
  listening = true;
  recActive = false;
  micBtn.style.width = '88px';
  micBtn.style.padding = '0';
  micBtn.style.fontSize = '40px';
  micBtn.textContent = '🎤';
  micBtn.classList.add('listening');
  setStatus('Mluv…');
  try { rec && rec.stop(); } catch(_){}   // kdyby nějaká instance visela
  audioCtx();   // v gestu: unlock AudioContext (ať první přehrání neblokuje)
  setTimeout(() => { if (listening && !speaking) startRec(); }, 400);
}
