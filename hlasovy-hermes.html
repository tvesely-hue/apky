<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hlasový Hermes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Hlasový Hermes</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { font-family:-apple-system,system-ui,sans-serif; background:#0e1117; color:#e8e8ea; height:100vh; height:100dvh; display:flex; flex-direction:column; overflow:hidden; }
  header { padding:14px; text-align:center; font-size:17px; font-weight:700; background:#161a22; position:relative; }
  .gear { position:absolute; right:12px; top:12px; background:none; border:none; color:#7a8494; font-size:20px; }
  #chat { flex:1; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:85%; padding:10px 14px; border-radius:16px; font-size:15px; line-height:1.4; word-wrap:break-word; }
  .me { align-self:flex-end; background:#2b6cb0; border-bottom-right-radius:4px; }
  .ai { align-self:flex-start; background:#232a35; border-bottom-left-radius:4px; }
  .playBtn { margin-top:8px; padding:10px 20px; border-radius:20px; border:none; background:#2b6cb0; color:#fff; font-size:14px; font-weight:600; }
  footer { padding:18px; background:#161a22; display:flex; flex-direction:column; align-items:center; gap:10px; }
  #micBtn { width:88px; height:88px; border-radius:50%; border:none; background:#2b6cb0; color:#fff; font-size:40px; box-shadow:0 4px 18px rgba(43,108,176,.45); }
  #micBtn.listening { background:#e53e3e; animation:pulse 1.2s infinite; }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(229,62,62,.5);} 70%{box-shadow:0 0 0 22px rgba(229,62,62,0);} 100%{box-shadow:0 0 0 0 rgba(229,62,62,0);} }
  #status { text-align:center; font-size:13px; color:#9aa5b5; min-height:18px; }
  .set { display:none; flex-direction:column; gap:8px; padding:14px; background:#161a22; }
  .set.show { display:flex; }
  .set input { padding:10px; border-radius:8px; border:1px solid #333; background:#0e1117; color:#fff; font-size:14px; }
  .set button { padding:10px; border-radius:8px; border:none; background:#2b6cb0; color:#fff; font-size:14px; }
</style>
</head>
<body>
<header>Hlasový Hermes 🎙️<button class="gear" onclick="document.getElementById('set').classList.toggle('show')">⚙️</button></header>

<div id="set" class="set">
  <label style="font-size:13px;">OpenRouter API key (začíná sk-or-)</label>
  <input id="key" type="password" placeholder="vlož klíč">
  <button onclick="saveKey()">Uložit klíč</button>
  <button onclick="testSound()" style="background:#e6b800;">🎵 Test zvuku</button>
</div>

<div id="chat"></div>
<div id="status">Klepi jednou na tlačítko — pak už jen mluv</div>
<footer>
  <button id="micBtn" onclick="toggleMic()">🎤</button>
</footer>

<script>
let listening = false, rec = null;
let key = localStorage.getItem('gkey') || '';
const statusEl = document.getElementById('status');

/* iOS: hlasy se načítají asynchronně — načteme je hned při startu */
if (typeof speechSynthesis !== 'undefined') {
  speechSynthesis.getVoices();
  speechSynthesis.onvoiceschanged = () => { speechSynthesis.getVoices(); };
}
const chatEl = document.getElementById('chat');
const micBtn = document.getElementById('micBtn');

if (key) document.getElementById('key').value = '••••••';
// automatické předvyplnění klíče z URL (?key=...)
try {
  const u = new URL(location.href);
  const k = u.searchParams.get('key');
  if (k) { localStorage.setItem('gkey', k); key = k; history.replaceState(null,'',location.pathname); }
} catch(e){}
if (key) document.getElementById('key').value = '••••••';
function saveKey(){ key = document.getElementById('key').value.trim(); localStorage.setItem('gkey', key); addMsg('me','Klíč uložen ✅'); document.getElementById('set').classList.remove('show'); }

function addMsg(cls, text){
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.textContent = text;
  if (cls === 'ai') {
    const b = document.createElement('button');
    b.className = 'playBtn';
    b.textContent = '🔊 Přečíst';
    // PRŮMÝ: jeden klepnutí = přímé přehrání audio elementu, bez řetězců
    b.onclick = () => { speakNow(text); };
    d.appendChild(b);
  }
  chatEl.appendChild(d);
  chatEl.scrollTop = chatEl.scrollHeight;
}
function setStatus(t){ statusEl.textContent = t; }

/* ====== HLAS: audio element + Google TTS, zvuky se stáhnou DOPŘEDU (při gestu)
   a pak přehrají z lokální paměti — na iOS je to jediný spolehlivý mechanismus ====== */
const player = new Audio();
let speakQueue = [];

function ttsUrl(text){
  return 'https://translate.google.com/translate_tts?ie=UTF-8&tl=cs&client=tw-ob&q=' + encodeURIComponent(text.slice(0,190));
}

function speakNow(text){
  try { rec && rec.stop(); } catch(_){}
  setStatus('🔴 Odpovídám…');
  const sents = text.match(/[^.!?]+[.!?]+(\s|$)|[^.!?]+$/g) || [text];
  const parts = [];
  let cur = '';
  for (const s of sents){
    if ((cur + s).length > 185) { if (cur) parts.push(cur); cur = s; }
    else cur += s;
  }
  if (cur) parts.push(cur);
  // Verze 8: PRVNÍ kus se přehraje SYNCHRONNĚ tady (v gestu klepnutí) — iOS pak řetěz dovolí
  speakQueue = parts;
  playChunk(0);
}

function playChunk(i){
  if (i >= speakQueue.length) { restartListening(); return; }
  player.src = speakQueue[i];
  player.onended = () => { playChunk(i + 1); };
  player.onerror = () => { setStatus('🔊 Nepovedlo se přehrát'); restartListening(); };
  player.volume = 1;
  const pp = player.play();
  if (pp) pp.catch(() => { setStatus('🔊 Nepovedlo se přehrát'); restartListening(); });
}

function testSound(){
  // Přímo audio element — synchronně v gestu (blob fetch na iOS blokuje CORS)
  const p = new Audio(ttsUrl('Test zvuku. Slyšíš mě po celou větu?'));
  p.volume = 1;
  p.play().then(()=>{ setStatus('Zvuk hraje ✅'); }).catch(e=>{ setStatus('Nepovedlo se přehrát: ' + (e.message||'')); });
}

/* po přehrání odpovědi se poslech sám obnoví — nemusíš vypínat/zapínat mikrofon */
function restartListening(){
  if (!listening) return;
  setStatus('Mluv…');
  try { rec && rec.stop(); } catch(_){}
  setTimeout(() => {
    if (listening) startRec();
  }, 1200);
}

/* ====== ZPRÁVY / API ====== */
/* zjištění polohy (GPS) — pro počasí */
function getPos(){
  return new Promise((res) => {
    if (!navigator.geolocation) return res(null);
    navigator.geolocation.getCurrentPosition(
      (p) => res({ lat: p.coords.latitude, lon: p.coords.longitude }),
      () => res(null),
      { timeout: 8000 }
    );
  });
}

/* počasí z Open-Meteo (zdarma, bez klíče) */
async function weatherData(){
  const pos = await getPos();
  if (!pos) return null;
  const u = 'https://api.open-meteo.com/v1/forecast?latitude=' + pos.lat + '&longitude=' + pos.lon +
    '&current=temperature_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m&daily=temperature_2m_max,temperature_2m_min,precipitation_sum&timezone=auto';
  const r = await fetch(u);
  const j = await r.json();
  return j;
}

/* paměť konverzace — appka si pamatuje, co jsme si řekli */
let history = [];

async function ask(text){
  if (!key) { addMsg('ai','Nejdřív vlož OpenRouter key (⚙️ vpravo nahoře).'); speakNow('Nejdřív vlož klíč OpenRouter. Nahoře je ozubené kolo.'); return; }
  addMsg('me', text);
  setStatus('🤔 Přemýšlím…');
  const t = text.toLowerCase();
  let extra = '';
  try {
    if (/počas|pocasi|jak.*venku|prš|déšť|dest|teplota|ochlad|venku/.test(t)) {
      const w = await weatherData();
      if (w) {
        extra = 'Aktuální počasí podle GPS uživatele: ' +
          'teplota ' + Math.round(w.current.temperature_2m) + ' °C, pocitově ' + Math.round(w.current.apparent_temperature) +
          ' °C, srážky ' + (w.current.precipitation||0) + ' mm, vítr ' + Math.round(w.current.wind_speed_10m) + ' km/h. ' +
          'Dnes max ' + Math.round(w.daily.temperature_2m_max[0]) + ' °C, min ' + Math.round(w.daily.temperature_2m_min[0]) +
          ' °C, srážky ' + (w.daily.precipitation_sum[0]||0) + ' mm. ';
      }
    }
  } catch(e){}
  try {
    const r = await fetch('https://openrouter.ai/api/v1/chat/completions', {
      method: 'POST',
      headers: {'Content-Type':'application/json','Authorization':'Bearer ' + key},
      body: JSON.stringify({
        model: 'z-ai/glm-5.3-flash',
        messages: [
          { role:'system', content:'Jsi přátelský hlasový asistent jménem Hermes. Odpovídej česky, stručně (max 3–4 krátké věty), přirozeně — odpověď se bude číst nahlas při řízení auta. Nepoužívej markdown ani seznamy.' },
          { role:'system', content: extra },
          ...history,
          { role:'user', content: text }
        ]
      })
    });
    const j = await r.json();
    const out = (j.choices?.[0]?.message?.content || '').replace(/\*\*/g,'').replace(/[*_#>\-]{1,2}/g,'');
    if (!out) throw new Error(JSON.stringify(j).slice(0,120));
    history.push({ role:'user', content: text });
    history.push({ role:'assistant', content: out });
    if (history.length > 12) history = history.slice(-12);
    addMsg('ai', out);
    speakNow(out);
  } catch(e){
    addMsg('ai','Chyba: ' + e.message);
    speakNow('Něco se nepovedlo, zkus to znovu.');
  }
}

/* ====== MIKROFON ====== */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

/* nová instance rozpoznávání — Safari na iPhonu po stop() stejnou instanci znovu nespustí,
   takže vždy vytvoříme úplně novou */
function startRec(){
  rec = new SR();
  rec.lang = 'cs-CZ';
  rec.continuous = true;
  rec.interimResults = false;
  rec.onstart = () => { setStatus('Mluv…'); };
  rec.onresult = (e) => {
    const t = e.results[e.results.length-1][0].transcript.trim();
    if (t) ask(t);
  };
  rec.onerror = (e) => { if (e.error==='not-allowed') addMsg('ai','Musíš povolit mikrofon (Nastavení Safari → Mikrofon).'); };
  rec.onend = () => {
    if (listening) { setTimeout(() => { if (listening) { try { rec.start(); } catch(_){} } }, 300); }
  };
  rec.start();
}

function toggleMic(){
  if (!SR) { addMsg('ai','Tvůj prohlížeč nepodporuje rozpoznávání řeči. Otevř v Safari (iPhone) nebo Chrome.'); return; }
  if (listening) { listening = false; try { rec.stop(); } catch(_){} micBtn.classList.remove('listening'); setStatus('Vypnuto'); return; }
  listening = true;
  micBtn.classList.add('listening');
  startRec();
}
</script>
</body>
</html>
